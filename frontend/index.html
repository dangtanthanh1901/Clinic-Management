<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý phòng khám</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b2421;--muted:#5d6b66;--scrub:#1f4d45;--scrub2:#2d6a5f;--chart:#eef3f0;--paper:#fff;--line:#d5e0db;--amber:#b86e00;--amberbg:#fff3d6;--red:#b3261e;--redbg:#fde8e6;--ok:#1d6b3a;--okbg:#dcf1e3}
@media(prefers-color-scheme:dark){:root{--ink:#e6efed;--muted:#9bb0aa;--scrub:#0f2f2a;--scrub2:#2d8a7a;--chart:#111a18;--paper:#1a2624;--line:#2b3b38;--amber:#f0b44a;--amberbg:#3a2d10;--red:#ff8a7d;--redbg:#3d1a17;--ok:#7fd69b;--okbg:#17321f}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--chart);font-size:15px;line-height:1.5;display:grid;grid-template-columns:236px 1fr}
nav{background:var(--scrub);color:#e8f1ee;padding:20px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font-size:18px;font-weight:600;padding:4px 12px 18px;line-height:1.25}
.brand small{display:block;font-weight:400;font-size:13px;opacity:.7}
nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:6px;color:#cfe0da}
nav button:hover{background:rgba(255,255,255,.09)}
nav button[aria-current=page]{background:#fff;color:#1f4d45;font-weight:600}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
main{padding:28px 32px 56px;max-width:1120px;width:100%}
h1{font-size:24px;margin:0;font-weight:600}
h2{font-size:17px;margin:28px 0 10px;font-weight:600}
h3{margin:0 0 4px;font-size:18px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.tools,.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
input,select,textarea,button{font:inherit}
input,select,textarea{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);min-width:0}
button{padding:8px 14px;border:1px solid var(--line);background:var(--paper);border-radius:6px;cursor:pointer;color:var(--ink)}
button:hover{border-color:var(--scrub2)}
button.primary{background:var(--scrub2);border-color:var(--scrub2);color:#fff}
button.primary:hover{filter:brightness(1.08)}
button.danger{color:var(--red)}
button:disabled{opacity:.5;cursor:not-allowed}
label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
label input,label select,label textarea{font-size:15px;color:var(--ink)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:16px}
.tablewrap{background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:13px;background:rgba(127,160,150,.08)}
tr:last-child td{border-bottom:0}
td.act{text-align:right}
td.act button{padding:4px 10px;font-size:13px;margin-left:6px}
tr.low td{background:var(--amberbg)}
tr.empty td{color:var(--muted);text-align:center;padding:28px}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12.5px;background:var(--chart);border:1px solid var(--line)}
.badge.ok{background:var(--okbg);color:var(--ok);border-color:transparent}
.badge.warn{background:var(--amberbg);color:var(--amber);border-color:transparent}
.badge.bad{background:var(--redbg);color:var(--red);border-color:transparent}
.hint{color:var(--muted);font-size:13.5px;margin:8px 0 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:8px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 16px;border-left:4px solid var(--scrub2)}
.stat.warn{border-left-color:var(--amber)}
.stat b{display:block;font-size:26px;font-weight:600;line-height:1.2}
.stat span{color:var(--muted);font-size:13.5px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:16px}
.slot{padding:10px 0;text-align:center;border:1px solid var(--scrub2);color:var(--scrub2);font-weight:500}
.slot[aria-pressed=true]{background:var(--scrub2);color:#fff}
.slot:disabled{border-color:var(--line);background:rgba(127,160,150,.1);color:var(--muted);text-decoration:line-through}
.bars{display:grid;gap:8px;padding:14px 16px}
.bar-row{display:grid;grid-template-columns:130px 1fr 130px;gap:12px;align-items:center;font-size:14px}
.bar-track{background:var(--chart);border-radius:4px;height:14px;overflow:hidden}
.bar-fill{display:block;height:100%;background:var(--scrub2);border-radius:4px}
dialog{border:0;border-radius:10px;padding:0;width:min(560px,94vw);box-shadow:0 12px 40px rgba(0,0,0,.3);background:var(--paper);color:var(--ink)}
dialog::backdrop{background:rgba(10,20,18,.5)}
dialog form{padding:22px;display:grid;gap:12px}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.rx{display:grid;grid-template-columns:2fr 76px 2fr 34px;gap:8px}
.invoice dl{display:grid;grid-template-columns:1fr auto;gap:8px 16px;margin:12px 0}
.invoice dt{color:var(--muted)}
.invoice dd{margin:0;text-align:right}
.invoice .total{font-size:20px;font-weight:600;border-top:1px solid var(--line);padding-top:10px}
#toast{position:fixed;bottom:22px;right:22px;padding:12px 16px;border-radius:8px;background:var(--scrub2);color:#fff;max-width:380px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:99}
#toast.show{opacity:1;transform:none}
#toast.bad{background:#b3261e}
@media(max-width:780px){body{grid-template-columns:1fr}nav{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px}.brand{display:none}nav button{white-space:nowrap}main{padding:18px 14px 40px}.bar-row{grid-template-columns:90px 1fr 100px}}
@media print{body>*:not(dialog){display:none!important}dialog{position:static;box-shadow:none;width:100%}.foot{display:none}}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<nav id="nav" aria-label="Chức năng"></nav>
<main id="view" aria-live="polite"></main>
<div id="toast" role="status"></div>
<script>
// Nếu mở file trực tiếp (không qua server), đổi thành 'http://localhost:3000'
const API = '';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const view = $('#view');
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => Number(n || 0).toLocaleString('vi-VN') + ' đ';
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const gio = s => String(s || '').slice(0, 16).replace('T', ' ');
const opt = (rows, label, sel) => rows.map(r => `<option value="${esc(r.id)}"${String(r.id) === String(sel) ? ' selected' : ''}>${esc(label(r))}</option>`).join('');
const statusBadge = s => `<span class="badge ${s === 'đã khám' || s === 'đã thanh toán' ? 'ok' : s === 'đã hủy' ? 'bad' : 'warn'}">${esc(s)}</span>`;

async function api(path, method = 'GET', body) {
  const r = await fetch(API + '/api' + path, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Có lỗi xảy ra.');
  return d;
}
let tt;
function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(tt); tt = setTimeout(() => t.className = '', 3800);
}
const safe = fn => async (...a) => { try { await fn(...a); } catch (e) { toast(e.message, true); } };
const table = (heads, rows, empty = 'Chưa có dữ liệu.') =>
  `<div class="tablewrap"><table><thead><tr>${heads.map(x => `<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('') || `<tr class="empty"><td colspan="${heads.length}">${empty}</td></tr>`}</tbody></table></div>`;

// ---- Hộp thoại ----
function dialog(html, onSubmit) {
  const d = document.createElement('dialog');
  d.innerHTML = `<form method="dialog">${html}</form>`;
  document.body.appendChild(d);
  d.addEventListener('close', () => d.remove());
  $('form', d).addEventListener('submit', safe(async e => {
    if (e.submitter && e.submitter.value === 'cancel') return;
    e.preventDefault();
    if (onSubmit) await onSubmit(d);
    d.close();
  }));
  d.showModal();
  return d;
}
const info = (title, body) => dialog(`<h3>${title}</h3>${body}<div class="foot"><button class="primary" value="cancel">Đóng</button></div>`);

// ---- CRUD dùng chung (Bệnh nhân, Bác sĩ, Thuốc) ----
async function crudView(c) {
  const rows = await api('/' + c.path);
  view.innerHTML = `<header class="bar"><h1>${c.title}</h1><div class="tools"><input id="q" type="search" placeholder="Tìm kiếm…" aria-label="Tìm kiếm"><button id="add" class="primary">${c.add}</button></div></header>
    ${c.top ? c.top(rows) : ''}<div class="tablewrap"><table><thead><tr>${c.cols.map(x => `<th>${x.l}</th>`).join('')}<th></th></tr></thead><tbody id="tb"></tbody></table></div><div id="more"></div>`;
  const draw = () => {
    const t = $('#q').value.toLowerCase();
    const list = rows.filter(r => Object.values(r).join(' ').toLowerCase().includes(t));
    $('#tb').innerHTML = list.map(r => `<tr class="${c.rowClass ? c.rowClass(r) : ''}">${c.cols.map(x => `<td>${x.f ? x.f(r) : esc(r[x.k])}</td>`).join('')}
      <td class="act">${c.extra ? c.extra(r) : ''}<button data-e="${r.id}">Sửa</button><button class="danger" data-d="${r.id}">Xóa</button></td></tr>`).join('')
      || `<tr class="empty"><td colspan="${c.cols.length + 1}">Chưa có dữ liệu. Chọn “${c.add}” để bắt đầu.</td></tr>`;
  };
  draw(); $('#q').oninput = draw;
  const form = (row = {}) => {
    const body = c.fields.map(f => f.opts
      ? `<label>${f.l}<select name="${f.k}">${f.opts.map(o => `<option${o === row[f.k] ? ' selected' : ''}>${o}</option>`).join('')}</select></label>`
      : `<label>${f.l}<input name="${f.k}" type="${f.t || 'text'}" ${f.t === 'number' ? `min="${f.min ?? 0}" step="${f.step || 1}"` : ''} value="${esc(row[f.k])}" ${f.req ? 'required' : ''}></label>`).join('');
    dialog(`<h3>${row.id ? 'Sửa thông tin' : c.add}</h3>${body}<div class="foot"><button value="cancel" formnovalidate>Hủy</button><button class="primary">Lưu</button></div>`,
      async d => {
        await api(`/${c.path}${row.id ? '/' + row.id : ''}`, row.id ? 'PUT' : 'POST', Object.fromEntries(new FormData($('form', d))));
        toast('Đã lưu.'); route();
      });
  };
  $('#add').onclick = () => form();
  $('#tb').onclick = safe(async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.e) form(rows.find(r => r.id == b.dataset.e));
    if (b.dataset.d && confirm('Xóa dòng này? Thao tác không hoàn tác được.')) { await api(`/${c.path}/${b.dataset.d}`, 'DELETE'); toast('Đã xóa.'); route(); }
    if (b.dataset.x) await c.onExtra(b.dataset.x, b);
  });
  return rows;
}

// ---- Tổng quan ----
async function vTongQuan() {
  const [s, lk, th] = await Promise.all([api('/tongquan'), api('/lichkham'), api('/thuoc/ton-kho')]);
  const hn = lk.filter(l => l.ngaygio.slice(0, 10) === today() && l.trangthai !== 'đã hủy').sort((a, b) => a.ngaygio.localeCompare(b.ngaygio));
  const thap = th.filter(t => Number(t.tonkho) < Number(t.dinhmuccanhbao));
  view.innerHTML = `<header class="bar"><h1>Tổng quan</h1></header>
    <div class="stats">
      <div class="stat"><b>${s.lich_homnay}</b><span>Lịch khám hôm nay</span></div>
      <div class="stat"><b>${s.benhnhan}</b><span>Bệnh nhân</span></div>
      <div class="stat ${s.cho_thanh_toan ? 'warn' : ''}"><b>${s.cho_thanh_toan}</b><span>Hóa đơn chờ thanh toán</span></div>
      <div class="stat ${s.thuoc_thap ? 'warn' : ''}"><b>${s.thuoc_thap}</b><span>Thuốc dưới định mức</span></div>
      <div class="stat"><b>${money(s.doanhthu_thang)}</b><span>Doanh thu tháng này</span></div></div>
    <h2>Lịch khám hôm nay</h2>${table(['Giờ', 'Bác sĩ', 'Bệnh nhân', 'Trạng thái'], hn.map(l => [l.ngaygio.slice(11, 16), esc(l.bacsi), esc(l.benhnhan || '—'), statusBadge(l.trangthai)]), 'Hôm nay chưa có lịch khám.')}
    ${thap.length ? `<h2>Thuốc cần nhập thêm</h2>${table(['Thuốc', 'Tồn kho', 'Định mức'], thap.map(t => [esc(t.ten), `<b>${t.tonkho}</b> ${esc(t.donvi)}`, t.dinhmuccanhbao]))}` : ''}`;
}

// ---- Bệnh nhân ----
const vBenhNhan = () => crudView({
  path: 'benhnhan', title: 'Bệnh nhân', add: 'Thêm bệnh nhân',
  cols: [{ l: 'Mã', k: 'id' }, { l: 'Họ tên', k: 'hoten' }, { l: 'Ngày sinh', k: 'ngaysinh' }, { l: 'Giới tính', k: 'gioitinh' }, { l: 'Số điện thoại', k: 'sdt' }, { l: 'Địa chỉ', k: 'diachi' }],
  fields: [{ k: 'hoten', l: 'Họ tên', req: 1 }, { k: 'ngaysinh', l: 'Ngày sinh', t: 'date', req: 1 }, { k: 'gioitinh', l: 'Giới tính', opts: ['Nam', 'Nữ', 'Khác'] }, { k: 'sdt', l: 'Số điện thoại' }, { k: 'diachi', l: 'Địa chỉ' }],
  extra: r => `<button data-x="${r.id}">Hồ sơ</button>`,
  onExtra: async id => {
    const ba = await api('/benhan?benhnhan_id=' + id);
    info('Hồ sơ khám bệnh', table(['Mã', 'Ngày khám', 'Chẩn đoán', 'Loại'], ba.map(b => [b.id, esc(b.ngaykham), esc(b.chuandoan), b.benhan_goc_id ? `Tái khám của #${b.benhan_goc_id}` : 'Bệnh gốc']), 'Bệnh nhân chưa có bệnh án.'));
  },
});

// ---- Bác sĩ ----
const vBacSi = () => crudView({
  path: 'bacsi', title: 'Bác sĩ', add: 'Thêm bác sĩ',
  cols: [{ l: 'Mã', k: 'id' }, { l: 'Họ tên', k: 'hoten' }, { l: 'Chuyên khoa', k: 'chuyenkhoa' }, { l: 'Số điện thoại', k: 'sdt' }],
  fields: [{ k: 'hoten', l: 'Họ tên', req: 1 }, { k: 'chuyenkhoa', l: 'Chuyên khoa', req: 1 }, { k: 'sdt', l: 'Số điện thoại' }],
});

// ---- Đặt lịch khám ----
async function vLich() {
  const [bs, lk] = await Promise.all([api('/bacsi'), api('/lichkham')]);
  let chosen = null;
  view.innerHTML = `<header class="bar"><h1>Đặt lịch khám</h1></header>
    <div class="panel"><div class="row">
      <label>Bác sĩ<select id="bs">${opt(bs, b => `${b.hoten} – ${b.chuyenkhoa}`)}</select></label>
      <label>Ngày khám<input id="ngay" type="date" value="${today()}" min="${today()}"></label>
      <button id="book" class="primary" disabled>Đặt lịch</button></div>
      <div id="slots" class="slots" role="group" aria-label="Khung giờ"></div>
      <p class="hint">Mỗi ca 30 phút. Giờ đã có lịch hiển thị gạch ngang. Bệnh nhân được gắn vào lịch khi lập bệnh án.</p></div>
    <div class="bar"><h2 style="margin:0">Danh sách lịch khám</h2>
      <select id="fs" aria-label="Lọc trạng thái"><option value="">Tất cả trạng thái</option><option>đã đặt</option><option>đã khám</option><option>đã hủy</option></select></div>
    <div class="tablewrap"><table><thead><tr><th>Mã</th><th>Giờ khám</th><th>Bác sĩ</th><th>Bệnh nhân</th><th>Trạng thái</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>`;
  const draw = () => {
    const f = $('#fs').value;
    $('#tb').innerHTML = lk.filter(l => !f || l.trangthai === f).map(l => `<tr><td>${l.id}</td><td>${gio(l.ngaygio)}</td><td>${esc(l.bacsi)}</td><td>${esc(l.benhnhan || '—')}</td><td>${statusBadge(l.trangthai)}</td>
      <td class="act">${l.trangthai === 'đã đặt' ? `<button class="danger" data-h="${l.id}">Hủy lịch</button>` : ''}</td></tr>`).join('') || '<tr class="empty"><td colspan="6">Không có lịch khám.</td></tr>';
  };
  draw(); $('#fs').onchange = draw;
  const load = safe(async () => {
    chosen = null; $('#book').disabled = true;
    if (!$('#bs').value) { $('#slots').innerHTML = '<p class="hint">Hãy thêm bác sĩ trước.</p>'; return; }
    const s = await api(`/bacsi/${$('#bs').value}/lich-trong?ngay=${$('#ngay').value}`);
    $('#slots').innerHTML = s.map(x => `<button class="slot" data-g="${x.gio}" aria-pressed="false" ${x.trong ? '' : 'disabled'}>${x.gio}</button>`).join('');
  });
  $('#bs').onchange = $('#ngay').onchange = load;
  $('#slots').onclick = e => {
    const b = e.target.closest('.slot'); if (!b) return;
    $$('.slot').forEach(x => x.setAttribute('aria-pressed', 'false'));
    b.setAttribute('aria-pressed', 'true'); chosen = b.dataset.g; $('#book').disabled = false;
  };
  $('#book').onclick = safe(async () => {
    await api('/lichkham', 'POST', { bacsi_id: $('#bs').value, ngaygio: `${$('#ngay').value} ${chosen}:00` });
    toast('Đã đặt lịch khám.'); route();
  });
  $('#tb').onclick = safe(async e => {
    const b = e.target.closest('[data-h]');
    if (b && confirm('Hủy lịch khám này?')) { await api(`/lichkham/${b.dataset.h}/huy`, 'PUT'); toast('Đã hủy lịch.'); route(); }
  });
  load();
}

// ---- Bệnh án ----
async function vBenhAn() {
  const [bn, lk, ba] = await Promise.all([api('/benhnhan'), api('/lichkham'), api('/benhan')]);
  const free = lk.filter(l => l.trangthai === 'đã đặt' && !l.benhan_id);
  view.innerHTML = `<header class="bar"><h1>Bệnh án</h1></header>
    <form id="f" class="panel"><div class="row">
      <label>Bệnh nhân<select name="benhnhan_id" id="bn" required>${opt(bn, b => `#${b.id} – ${b.hoten}`)}</select></label>
      <label>Lịch khám<select name="lichkham_id" required>${opt(free, l => `#${l.id} – ${l.bacsi} – ${gio(l.ngaygio)}`)}</select></label>
      <label>Loại khám<select id="loai"><option value="moi">Khám mới (bệnh gốc)</option><option value="tai">Tái khám</option></select></label>
      <label id="gocw" hidden>Bệnh án gốc<select name="benhan_goc_id" id="goc"></select></label></div>
      <div class="row" style="margin-top:12px"><label style="flex:1">Chẩn đoán<input name="chuandoan"></label><label style="flex:1">Ghi chú<input name="ghichu"></label>
      <button class="primary" ${free.length && bn.length ? '' : 'disabled'}>Lập bệnh án</button></div>
      ${free.length ? '<p class="hint">Lập bệnh án xong, lịch khám tự chuyển sang “đã khám”.</p>' : '<p class="hint">Chưa có lịch khám nào ở trạng thái “đã đặt”. Hãy đặt lịch trước.</p>'}</form>
    <h2>Danh sách bệnh án</h2>
    <div class="tablewrap"><table><thead><tr><th>Mã</th><th>Bệnh nhân</th><th>Ngày khám</th><th>Chẩn đoán</th><th>Loại</th><th></th></tr></thead>
    <tbody id="tb">${ba.map(b => `<tr><td>${b.id}</td><td>${esc(b.benhnhan)}</td><td>${esc(b.ngaykham)}</td><td>${esc(b.chuandoan)}</td>
      <td>${b.benhan_goc_id ? `<span class="badge">Tái khám của #${b.benhan_goc_id}</span>` : '<span class="badge ok">Bệnh gốc</span>'}</td>
      <td class="act"><button data-rx="${b.id}">Kê đơn</button>${b.benhan_goc_id ? '' : `<button data-tk="${b.id}">Các lần tái khám</button>`}</td></tr>`).join('') || '<tr class="empty"><td colspan="6">Chưa có bệnh án nào.</td></tr>'}</tbody></table></div>`;
  const sync = () => {
    const tai = $('#loai').value === 'tai';
    $('#gocw').hidden = !tai; $('#goc').disabled = !tai;
    const roots = ba.filter(b => !b.benhan_goc_id && String(b.benhnhan_id) === $('#bn').value);
    $('#goc').innerHTML = roots.length ? opt(roots, b => `#${b.id} – ${b.chuandoan || 'chưa có chẩn đoán'}`) : '<option value="">Bệnh nhân chưa có bệnh gốc</option>';
  };
  $('#loai').onchange = $('#bn').onchange = sync; sync();
  $('#f').onsubmit = safe(async e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(e.target));
    if ($('#loai').value === 'moi') delete d.benhan_goc_id;
    await api('/benhan', 'POST', d); toast('Đã lập bệnh án.'); route();
  });
  $('#tb').onclick = safe(async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.rx) prescribe(b.dataset.rx);
    if (b.dataset.tk) {
      const t = await api(`/benhan/${b.dataset.tk}/tai-kham`);
      info(`Tái khám của bệnh án #${b.dataset.tk}`, table(['Mã', 'Ngày khám', 'Chẩn đoán'], t.map(x => [x.id, esc(x.ngaykham), esc(x.chuandoan)]), 'Chưa có lần tái khám nào.'));
    }
  });
}

// ---- Kê đơn (dùng chung cho Bệnh án và Đơn thuốc) ----
async function prescribe(benhanId) {
  const [thuoc, ba] = await Promise.all([api('/thuoc'), benhanId ? [] : api('/benhan')]);
  const line = () => `<div class="rx"><select name="thuoc_id">${opt(thuoc, t => `${t.ten} (còn ${t.tonkho} ${t.donvi})`)}</select>
    <input name="soluong" type="number" min="1" value="1" aria-label="Số lượng"><input name="lieudung" placeholder="Liều dùng" aria-label="Liều dùng">
    <button type="button" class="danger" data-x aria-label="Bỏ dòng">×</button></div>`;
  const d = dialog(`<h3>Kê đơn thuốc${benhanId ? ` cho bệnh án #${benhanId}` : ''}</h3>
    ${benhanId ? '' : `<label>Bệnh án<select name="benhan_id">${opt(ba, b => `#${b.id} – ${b.benhnhan} – ${b.chuandoan || ''}`)}</select></label>`}
    <div id="lines">${line()}</div><button type="button" id="more">Thêm thuốc</button>
    <p class="hint">Vượt tồn kho thì cả đơn bị hủy, tồn kho không thay đổi.</p>
    <div class="foot"><button value="cancel" formnovalidate>Hủy</button><button class="primary">Lưu đơn thuốc</button></div>`,
    async dlg => {
      const rows = $$('.rx', dlg).map(r => ({ thuoc_id: +$('[name=thuoc_id]', r).value, soluong: +$('[name=soluong]', r).value, lieudung: $('[name=lieudung]', r).value }));
      const gop = {};
      rows.forEach(r => { const g = gop[r.thuoc_id]; if (g) { g.soluong += r.soluong; g.lieudung = [g.lieudung, r.lieudung].filter(Boolean).join('; '); } else gop[r.thuoc_id] = { ...r }; });
      const items = Object.values(gop);
      await api('/donthuoc', 'POST', { benhan_id: Number(benhanId || $('[name=benhan_id]', dlg).value), items });
      toast('Đã lưu đơn thuốc, tồn kho đã được trừ.'); route();
    });
  $('#more', d).onclick = () => $('#lines', d).insertAdjacentHTML('beforeend', line());
  $('#lines', d).onclick = e => { if (e.target.dataset.x !== undefined && $$('.rx', d).length > 1) e.target.parentElement.remove(); };
}

// ---- Đơn thuốc ----
async function vDonThuoc() {
  const dt = await api('/donthuoc');
  view.innerHTML = `<header class="bar"><h1>Đơn thuốc</h1><button id="new" class="primary">Kê đơn mới</button></header>
    <div class="tablewrap"><table><thead><tr><th>Mã</th><th>Ngày lập</th><th>Bệnh nhân</th><th>Bệnh án</th><th>Số loại</th><th>Tiền thuốc</th><th></th></tr></thead>
    <tbody id="tb">${dt.map(x => `<tr><td>${x.id}</td><td>${esc(x.ngaylap)}</td><td>${esc(x.benhnhan)}</td><td>#${x.benhan_id}</td><td>${x.so_loai}</td><td>${money(x.tien)}</td><td class="act"><button data-i="${x.id}">Chi tiết</button></td></tr>`).join('') || '<tr class="empty"><td colspan="7">Chưa có đơn thuốc nào.</td></tr>'}</tbody></table></div>`;
  $('#new').onclick = () => prescribe(null);
  $('#tb').onclick = safe(async e => {
    const b = e.target.closest('[data-i]'); if (!b) return;
    const l = await api('/donthuoc/' + b.dataset.i);
    info(`Đơn thuốc #${b.dataset.i}`, table(['Thuốc', 'Số lượng', 'Liều dùng', 'Thành tiền'], l.map(x => [esc(x.ten), `${x.soluong} ${esc(x.donvi)}`, esc(x.lieudung), money(x.soluong * x.giaban)])));
  });
}

// ---- Kho thuốc ----
async function vKho() {
  await crudView({
    path: 'thuoc', title: 'Kho thuốc', add: 'Thêm thuốc',
    cols: [{ l: 'Mã', k: 'id' }, { l: 'Tên thuốc', k: 'ten' }, { l: 'Đơn vị', k: 'donvi' }, { l: 'Giá bán', f: r => money(r.giaban) }, { l: 'Tồn kho', f: r => `<b>${esc(r.tonkho)}</b>` }, { l: 'Định mức cảnh báo', k: 'dinhmuccanhbao' }],
    fields: [{ k: 'ten', l: 'Tên thuốc', req: 1 }, { k: 'donvi', l: 'Đơn vị (viên, hộp…)', req: 1 }, { k: 'giaban', l: 'Giá bán (đ)', t: 'number', min: 1, step: '0.01', req: 1 }, { k: 'tonkho', l: 'Tồn kho', t: 'number', req: 1 }, { k: 'dinhmuccanhbao', l: 'Định mức cảnh báo', t: 'number', req: 1 }],
    rowClass: r => Number(r.tonkho) < Number(r.dinhmuccanhbao) ? 'low' : '',
    top: rows => { const n = rows.filter(r => Number(r.tonkho) < Number(r.dinhmuccanhbao)).length; return n ? `<p class="panel"><span class="badge warn">${n} thuốc dưới định mức</span> Các dòng tô vàng cần nhập thêm.</p>` : ''; },
  });
  const logs = await api('/canhbao').catch(() => []);
  if (logs.length) {
    const keys = Object.keys(logs[0]);
    $('#more').innerHTML = `<h2>Nhật ký cảnh báo tồn kho</h2>${table(keys.map(esc), logs.map(r => keys.map(k => esc(r[k]))))}`;
  }
}

// ---- Hóa đơn ----
async function vHoaDon() {
  const [hd, lk] = await Promise.all([api('/hoadon'), api('/lichkham')]);
  const free = lk.filter(l => l.trangthai === 'đã khám' && !hd.some(h => h.lichkham_id === l.id));
  view.innerHTML = `<header class="bar"><h1>Hóa đơn và thanh toán</h1></header>
    <form id="f" class="panel"><div class="row">
      <label>Lịch đã khám<select name="lichkham_id" required>${opt(free, l => `#${l.id} – ${l.benhnhan || ''} – ${gio(l.ngaygio)}`)}</select></label>
      <label>Phí khám (đ)<input name="phikham" type="number" min="0" value="150000"></label>
      <button class="primary" ${free.length ? '' : 'disabled'}>Lập hóa đơn</button></div>
      <p class="hint">${free.length ? 'Tiền thuốc tự tính từ các đơn thuốc của bệnh án (sp_TinhVienPhi).' : 'Chưa có lịch đã khám nào cần lập hóa đơn.'}</p></form>
    <div class="tablewrap"><table><thead><tr><th>Mã</th><th>Giờ khám</th><th>Bệnh nhân</th><th>Phí khám</th><th>Tiền thuốc</th><th>Tổng</th><th>Trạng thái</th><th></th></tr></thead>
    <tbody id="tb">${hd.map(x => { const paid = x.trangthaithanhtoan === 'đã thanh toán'; return `<tr><td>${x.id}</td><td>${gio(x.ngaygio)}</td><td>${esc(x.benhnhan || '—')}</td><td>${money(x.phikham)}</td><td>${money(x.tienthuoc)}</td><td><b>${money(x.tongtien)}</b></td><td>${statusBadge(x.trangthaithanhtoan)}</td>
      <td class="act"><button data-p="${x.lichkham_id}">In</button>${paid ? '' : `<button data-t="${x.lichkham_id}">Tính lại</button><button class="primary" data-pay="${x.id}">Thanh toán</button>`}</td></tr>`; }).join('') || '<tr class="empty"><td colspan="8">Chưa có hóa đơn nào.</td></tr>'}</tbody></table></div>`;
  $('#f').onsubmit = safe(async e => { e.preventDefault(); await api('/hoadon', 'POST', Object.fromEntries(new FormData(e.target))); toast('Đã lập hóa đơn.'); route(); });
  $('#tb').onclick = safe(async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.t) { await api(`/hoadon/${b.dataset.t}/tinh`, 'POST'); toast('Đã tính lại viện phí.'); route(); }
    if (b.dataset.pay && confirm('Xác nhận hóa đơn đã thanh toán? Sau đó không thể sửa.')) { await api(`/hoadon/${b.dataset.pay}/thanhtoan`, 'POST'); toast('Đã thanh toán.'); route(); }
    if (b.dataset.p) {
      const x = await api('/hoadon/' + b.dataset.p);
      dialog(`<div class="invoice"><h3>Hóa đơn viện phí #${x.id}</h3><p class="hint">Bệnh nhân: ${esc(x.benhnhan || '—')} · Bác sĩ: ${esc(x.bacsi)} · ${gio(x.ngaygio)}</p>
        <dl><dt>Phí khám</dt><dd>${money(x.phikham)}</dd><dt>Tiền thuốc</dt><dd>${money(x.tienthuoc)}</dd><dt class="total">Tổng tiền</dt><dd class="total">${money(x.tongtien)}</dd><dt>Trạng thái</dt><dd>${esc(x.trangthaithanhtoan)}</dd></dl></div>
        <div class="foot"><button value="cancel">Đóng</button><button type="button" class="primary" onclick="print()">In hóa đơn</button></div>`);
    }
  });
}

// ---- Thống kê ----
async function vThongKe() {
  const first = today().slice(0, 8) + '01';
  view.innerHTML = `<header class="bar"><h1>Thống kê doanh thu</h1></header>
    <div class="panel row"><label>Từ ngày<input id="tu" type="date" value="${first}"></label><label>Đến ngày<input id="den" type="date" value="${today()}"></label>
      <label>Nhóm theo<select id="kieu"><option value="ngay">Theo ngày</option><option value="bacsi">Theo bác sĩ</option></select></label><button id="go" class="primary">Xem báo cáo</button></div><div id="out"></div>`;
  const run = safe(async () => {
    const rows = await api(`/thongke?tu=${$('#tu').value}&den=${$('#den').value}&kieu=${$('#kieu').value}`);
    if (!rows.length) { $('#out').innerHTML = '<p class="hint">Không có hóa đơn đã thanh toán trong khoảng này.</p>'; return; }
    const max = Math.max(...rows.map(r => Number(r.doanh_thu)));
    const total = rows.reduce((s, r) => s + Number(r.doanh_thu), 0);
    $('#out').innerHTML = `<p class="panel"><b>Tổng doanh thu:</b> ${money(total)} · ${rows.reduce((s, r) => s + Number(r.so_hoa_don), 0)} hóa đơn</p>
      <div class="panel bars" style="padding:16px">${rows.map(r => `<div class="bar-row"><span>${esc(r.nhom)}</span><span class="bar-track"><span class="bar-fill" style="width:${Math.max(2, Number(r.doanh_thu) / max * 100)}%"></span></span><b style="text-align:right">${money(r.doanh_thu)}</b></div>`).join('')}</div>
      ${table([$('#kieu').value === 'bacsi' ? 'Bác sĩ' : 'Ngày', 'Số hóa đơn', 'Doanh thu'], rows.map(r => [esc(r.nhom), r.so_hoa_don, money(r.doanh_thu)]))}`;
  });
  $('#go').onclick = run; run();
}

// ---- Điều hướng ----
const routes = { tongquan: ['Tổng quan', vTongQuan], benhnhan: ['Bệnh nhân', vBenhNhan], lich: ['Đặt lịch khám', vLich], benhan: ['Bệnh án', vBenhAn], donthuoc: ['Đơn thuốc', vDonThuoc], hoadon: ['Hóa đơn', vHoaDon], kho: ['Kho thuốc', vKho], bacsi: ['Bác sĩ', vBacSi], thongke: ['Thống kê', vThongKe] };
$('#nav').innerHTML = `<div class="brand">Phòng khám<small>Nhóm 4 – Cơ sở dữ liệu</small></div>` + Object.entries(routes).map(([k, [t]]) => `<button data-r="${k}">${t}</button>`).join('');
function route() {
  const r = location.hash.slice(1) in routes ? location.hash.slice(1) : 'tongquan';
  $$('#nav button').forEach(b => b.dataset.r === r ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  safe(() => routes[r][1]())();
}
$('#nav').onclick = e => { const b = e.target.closest('button'); if (b) location.hash = b.dataset.r; };
addEventListener('hashchange', route);
route();
</script>
</body>
</html>
